name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# `pages: write` + `id-token: write` are what `deploy-pages` needs to publish
# the uploaded artifact; nothing else in the repo is writable from this job.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy halfway, but skip queued ones superseded by a newer push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Publish only the standalone HTML pages from docs/. The site root
      # redirects to the boot datasheet so the bare Pages URL isn't a 404.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp docs/*.html _site/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>papi_os docs</title>
          <meta http-equiv="refresh" content="0; url=boot-and-bus.html">
          <a href="boot-and-bus.html">Boot Datasheet</a>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
